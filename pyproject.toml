[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vietlegal"
version = "0.1.0"
description = "Vietnamese legal research assistant foundations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
baseline = [
    "accelerate>=1.6,<2",
    "huggingface-hub>=0.30,<2",
    "psutil>=6,<8",
    "safetensors>=0.5,<1",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
]

[project.scripts]
vietlegal-baseline = "vietlegal.model.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pip-audit>=2.8,<3",
    "pymarkdownlnt>=0.9,<1",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vietlegal"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=vietlegal --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = ["gpu: requires a CUDA-capable GPU and the baseline extra"]

[tool.coverage.run]
branch = true
source = ["vietlegal"]

[tool.coverage.report]
show_missing = true
skip_covered = true
omit = [
  "src/vietlegal/model/cli.py",
  "src/vietlegal/model/transformers_backend.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
